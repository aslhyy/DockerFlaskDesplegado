name: Publicar Imagen en Docker Hub

on:
  push:
    branches: ["main"]

jobs:
  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v3
      
      - name: Iniciar sesión en docker hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir imagen
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: false
          load: true
          tags: aslhyy/proyecto-compose-backend:latest

      - name: Escanear contenedor con trivy
        uses: aquasecurity/trivy-action@master
        whit:
          image-ref: 'aslhyy/proyecto-compose-backend:latest'
          format: 'table'
          exit-code: '1' # Si encuentra alguna falla, rompe la ejecución
          ignore-unfixed: true
          vuln-type: 'os, librery'
          severity: 'CRITICAL,HIGH' # Son los que van a detener la ejecución

      - name: Subir la imagen a Docker Hub
        run: docker push aslhyy/proyecto-compose-backend:latest


      - name: Desplegar en el servidor cloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/DockerFlaskDesplegado
            docker compose pull backend
            docker compose up -d

  test-and-security:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          pip install pytest bandit

      - name: Escaneo de seguridad (bandit)
        run: bandit -r . -s B101 #Ignorar los arxhivos asset


      - name: Ejecutar pruebas
        run: pytest